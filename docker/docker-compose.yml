services:
  node1:
    build: ..
    ports: ["7070:7070"]
    volumes: ["node1-data:/data"]
    command: ["--node-id", "node1", "--host", "0.0.0.0", "--port", "7070", "--data-dir", "/data", "--peer", "node2=node2:7070", "--peer", "node3=node3:7070"]
  node2:
    build: ..
    ports: ["7080:7070"]
    volumes: ["node2-data:/data"]
    command: ["--node-id", "node2", "--host", "0.0.0.0", "--port", "7070", "--data-dir", "/data", "--peer", "node1=node1:7070", "--peer", "node3=node3:7070"]
  node3:
    build: ..
    ports: ["7090:7070"]
    volumes: ["node3-data:/data"]
    command: ["--node-id", "node3", "--host", "0.0.0.0", "--port", "7070", "--data-dir", "/data", "--peer", "node1=node1:7070", "--peer", "node2=node2:7070"]

volumes:
  node1-data:
  node2-data:
  node3-data:
